# Only these entry points may be requested over HTTP. PHP can still require
# config.php, shared helpers, and vendor dependencies internally.
<Directory "/var/www/html">
    AllowOverride None
    Options -Indexes -MultiViews
    DirectoryIndex disabled
    AcceptPathInfo Off
    Require expr "%{REQUEST_URI} =~ m#^/(?:wishes\.php|wishes\.js|admin_secret_santa\.php|import_users\.php)$#"
</Directory>
